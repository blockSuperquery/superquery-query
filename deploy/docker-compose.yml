# Local stack: Postgres + node + query.
#
# The pairing that matters: the node's `--db-schema` and the query service's
# `--name` must be the same value. That schema name IS the project identity —
# there is no separate project id.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # The indexer owns every write. Swap this image for the Rust node once it
  # ships; the query service reads the same schema either way.
  superquery-node:
    image: subquerynetwork/subql-node-stellar:latest
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      # Your project directory: manifest, schema.graphql, mappings.
      - ../../your-project:/app
    command:
      - -f=/app
      - --db-schema=app
      - --workers=2
      - --batch-size=10
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://superquery-node:3000/ready']
      interval: 3s
      timeout: 5s
      retries: 10

  superquery-query:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      superquery-node:
        # Wait for the node: the query service validates the project schema
        # against the database at startup and exits if the tables are missing.
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ../../your-project:/project:ro
    command:
      - --name=app
      - --schema=/project/schema.graphql
      - --playground
    healthcheck:
      test: ['CMD', '/usr/local/bin/superquery-query', '--version']
      interval: 10s
      timeout: 5s
      retries: 3
